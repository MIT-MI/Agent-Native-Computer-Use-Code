schema_version = "1.3"
artifacts = ["/app/desktop-session", { source = "/app/work", exclude = [".browser", ".config", ".runtime"] }]

[task]
name = "reef/freecad-enclosure-release"
version = "0.11.1"
description = "Release a two-part field enclosure revision with mounts, ports, vents and a label plate"

[metadata]
category = "application-workflow"
tags = ["freecad", "cua", "mcp"]

[agent]
timeout_sec = 5400.0

[verifier]
timeout_sec = 180.0

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 4096
gpus = 0

[environment.env]
REEF_INTERFACE = "${REEF_INTERFACE:-mcp}"
REEF_DESKTOP_COORDINATES = "${REEF_DESKTOP_COORDINATES:-pixels}"

[environment.healthcheck]
command = "test -f /app/ready"
interval_sec = 1.0
timeout_sec = 2.0
retries = 60

[[environment.mcp_servers]]
name = "reef"
transport = "stdio"
command = "node"
args = ["/opt/reef/interface.mjs"]
