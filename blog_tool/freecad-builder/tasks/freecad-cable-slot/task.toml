schema_version = "1.3"
artifacts = ["/app/desktop-session", { source = "/app/work", exclude = [".browser", ".config", ".runtime"] }]

[task]
name = "reef/freecad-cable-slot"
version = "0.6.0"
description = "Add a linked cable opening to a revised mounting plate"

[metadata]
category = "application-workflow"
tags = ["freecad", "cua", "mcp"]

[agent]
timeout_sec = 1200.0

[verifier]
timeout_sec = 120.0

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 4096
gpus = 0

[environment.env]
REEF_INTERFACE = "${REEF_INTERFACE:-mcp}"

[environment.healthcheck]
command = "test -f /app/ready"
interval_sec = 1.0
timeout_sec = 2.0
retries = 60

[[environment.mcp_servers]]
name = "reef"
transport = "stdio"
command = "node"
args = ["/opt/reef/interface.mjs"]
